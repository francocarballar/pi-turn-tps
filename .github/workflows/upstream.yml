name: Current Pi compatibility
on:
  schedule:
    - cron: '41 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-compatibility
  cancel-in-progress: false
jobs:
  current:
    name: Current npm Pi / Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test current registry pair without changing pinned metadata
        run: npm install --no-save --package-lock=false --ignore-scripts @earendil-works/pi-coding-agent@latest @earendil-works/pi-ai@latest
      - run: npm ls @earendil-works/pi-coding-agent @earendil-works/pi-ai
      - run: npm run verify
