name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable version tag, e.g. v0.2.0
        required: true
        type: string
      publish:
        description: Publish the verified artifact to npm (requires trusted publisher)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  verification:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag }}
  artifact:
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate workflow input against manifest (no shell interpolation)
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./package.json").version) process.exit(1)'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:prepare
      - if: inputs.publish
        run: npm run release:publish
      - if: inputs.publish
        run: npm run check:published
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.tag }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
